<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Rup's Art Supply</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="logo-area">

            <img
                src="images/logo.jpeg"
                alt="Rup's Art Supply Logo"
            >

            <h2>Rup's Art Supply</h2>

        </div>


        <nav class="main-navigation">

            <a href="index.html">
                Home
            </a>

            <a href="products.html?category=toys">
                Toys
            </a>

            <a href="products.html?category=stationery">
                Daily Stationery
            </a>

            <a href="products.html?category=gifts">
                Gift Items
            </a>

            <a href="wishlist.html">
                ❤️ Wishlist
                <span id="wishlistCount">0</span>
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <main class="login-page">

        <div class="login-box">


            <!-- LOGO - NOT CLICKABLE -->

            <img
                src="images/logo.jpeg"
                alt="Rup's Art Supply Logo"
                class="login-logo"
            >


            <h1>
                Welcome Back
            </h1>


            <p>
                Login to Rup's Art Supply
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <!-- LOGIN MESSAGE -->

            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <a href="index.html">
                ← Back to Home
            </a>


        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Rup's Art Supply.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
